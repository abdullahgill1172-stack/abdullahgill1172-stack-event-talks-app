<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BigQuery Release Notes</title>
    <meta name="description" content="Live RSS Feed and Tweet Composer for Google Cloud BigQuery Release Notes">
    
    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Custom Stylesheet -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">
</head>
<body>
    <div class="container">
        <!-- App Header -->
        <header class="header">
            <div class="brand">
                <div class="brand-icon">
                    <svg viewBox="0 0 24 24">
                        <path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-5 14H7v-2h7v2zm3-4H7v-2h10v2zm0-4H7V7h10v2z"/>
                    </svg>
                </div>
                <div class="title-group">
                    <h1>BigQuery Release Notes</h1>
                    <p>Live Google Cloud BigQuery updates &amp; announcements</p>
                </div>
            </div>
            <div class="header-actions">
                <button class="theme-toggle-btn" id="themeToggleBtn" title="Toggle Light/Dark Theme">
                    <svg id="themeIcon" viewBox="0 0 24 24"><path d="M12 3c-4.97 0-9 4.03-9 9s4.03 9 9 9 9-4.03 9-9c0-.46-.04-.92-.1-1.36-.98 1.37-2.58 2.26-4.4 2.26-2.98 0-5.4-2.42-5.4-5.4 0-1.81.89-3.42 2.26-4.4C12.92 3.04 12.46 3 12 3z"/></svg>
                </button>
                <span class="last-updated" id="lastUpdated">Updated just now</span>
                <button class="btn-refresh" id="refreshBtn" title="Refresh Release Notes">
                    <span class="spinner"></span>
                    <svg class="refresh-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="23 4 23 10 17 10"></polyline>
                        <polyline points="1 20 1 14 7 14"></polyline>
                        <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path>
                    </svg>
                    <span>Refresh</span>
                </button>
            </div>
        </header>

        <!-- Controls and Filter Bar -->
        <section class="controls-bar">
            <div class="search-box">
                <svg viewBox="0 0 24 24">
                    <path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/>
                </svg>
                <input type="text" id="searchInput" placeholder="Search release notes by title or content...">
            </div>
            
            <div class="filter-tags" id="filterContainer">
                <button class="filter-tag active" data-category="ALL">All Updates</button>
                <button class="filter-tag" data-category="FEATURE">Features</button>
                <button class="filter-tag" data-category="CHANGED">Changed</button>
                <button class="filter-tag" data-category="FIXED">Fixed</button>
                <button class="filter-tag" data-category="ANNOUNCEMENT">Announcements</button>
            </div>
            <button class="btn-utility" id="exportCsvBtn" title="Export Current View to CSV">
                <svg viewBox="0 0 24 24"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg>
                <span>Export CSV</span>
            </button>
        </section>

        <!-- Feed List Container -->
        <main class="feed-container" id="feedContainer">
            <div class="loading-state">
                <div class="loading-spinner-lg"></div>
                <p>Fetching latest BigQuery release notes...</p>
            </div>
        </main>
    </div>

    <!-- Tweet Modal Composer -->
    <div class="modal-backdrop" id="modalBackdrop">
        <div class="modal">
            <div class="modal-header">
                <h3>
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="#1da1f2"><path d="M23.953 4.57a10 10 0 01-2.825.775 4.958 4.958 0 002.163-2.723c-.951.555-2.005.959-3.127 1.184a4.92 4.92 0 00-8.384 4.482C7.69 8.095 4.067 6.13 1.64 3.162a4.822 4.822 0 00-.666 2.475c0 1.71.87 3.213 2.188 4.096a4.904 4.904 0 01-2.228-.616v.06a4.923 4.923 0 003.946 4.827 4.996 4.996 0 01-2.212.085 4.936 4.936 0 004.604 3.417 9.867 9.867 0 01-6.102 2.105c-.39 0-.779-.023-1.17-.067a13.995 13.995 0 007.557 2.209c9.053 0 13.998-7.496 13.998-13.985 0-.21 0-.42-.015-.63A9.936 9.936 0 0024 4.59z"/></svg>
                    Tweet BigQuery Update
                </h3>
                <button class="btn-close" id="btnCloseModal">&times;</button>
            </div>
            <textarea class="tweet-textarea" id="tweetTextarea" placeholder="Customize your tweet message..."></textarea>
            <div class="modal-footer">
                <span class="char-counter" id="charCounter">280 characters remaining</span>
                <button class="btn-post-tweet" id="btnPostTweet">
                    <span>Tweet Now</span>
                </button>
            </div>
        </div>
    </div>

    <!-- Application Script -->
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
